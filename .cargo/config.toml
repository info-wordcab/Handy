[build]

# Fix Windows linker conflicts between msvcprt.lib and libcpmt.lib
# Use dynamic linking for the C runtime and exclude conflicting libraries
[target.'cfg(target_os = "windows")']
rustflags = [
  "-C", "target-feature=-crt-static",
  "-C", "link-arg=/NODEFAULTLIB:libcmt",
  "-C", "link-arg=/NODEFAULTLIB:libcmtd",
  "-C", "link-arg=/NODEFAULTLIB:msvcrtd"
]
