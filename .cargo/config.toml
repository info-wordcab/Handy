[build]

# Fix Windows linker conflicts between msvcprt.lib and libcmtd.lib
# Use dynamic linking for the C runtime and exclude conflicting libraries
[target.'cfg(target_os = "windows")']
rustflags = [
  "-C", "target-feature=-crt-static",
  "-C", "link-arg=/NODEFAULTLIB:libcmt",
  "-C", "link-arg=/NODEFAULTLIB:libcmtd",
  "-C", "link-arg=/NODEFAULTLIB:msvcrtd",
  "-C", "link-arg=/DEFAULTLIB:msvcrt"
]

# Ensure C/C++ dependencies use the same runtime library on Windows only
[target.x86_64-pc-windows-msvc.env]
CXXFLAGS = "/MD"
CFLAGS = "/MD"
